services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "15435:5432"
    environment:
      POSTGRES_DB: this_is_pun_admin
      POSTGRES_USER: pun
      POSTGRES_PASSWORD: pun123
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      BACKEND_PORT: 8080
      DATABASE_URL: postgres://pun:pun123@postgres:5432/this_is_pun_admin?sslmode=disable
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: minio:9000
    depends_on:
      - postgres
      - redis
      - minio

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  admin:
    build: ./admin
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
